<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient: Pure Pitch Black to Dark Charcoal -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#05080E" />
      <stop offset="100%" stop-color="#020306" />
    </linearGradient>

    <!-- Signature Spotify Green Gradient -->
    <linearGradient id="spotify-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1DB954" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- White Glow Gradient -->
    <linearGradient id="white-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Glassmorphism Blur -->
    <filter id="blur-bg" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="70" />
    </filter>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(29, 185, 84, 0.05)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)" />
  <rect width="1200" height="320" rx="16" fill="url(#grid)" />

  <!-- Ambient Green Glow Orbs -->
  <circle cx="180" cy="80" r="180" fill="#1DB954" opacity="0.18" filter="url(#blur-bg)" />
  <circle cx="1020" cy="240" r="200" fill="#10B981" opacity="0.14" filter="url(#blur-bg)" />
  <circle cx="600" cy="160" r="130" fill="#FFFFFF" opacity="0.05" filter="url(#blur-bg)" />

  <!-- Border Highlight: Green Neon Stroke -->
  <rect x="1" y="1" width="1198" height="318" rx="15" fill="none" stroke="url(#spotify-green)" stroke-opacity="0.4" stroke-width="2" />

  <!-- Decorative Tech Matrix -->
  <g opacity="0.3" stroke="#1DB954" stroke-width="1" fill="none">
    <polygon points="60,40 85,25 110,40 110,70 85,85 60,70" />
    <polygon points="115,40 140,25 165,40 165,70 140,85 115,70" />
    <polygon points="87,88 112,73 137,88 137,118 112,133 87,118" />
  </g>

  <!-- Code Accents -->
  <text x="60" y="270" font-family="'Fira Code', monospace" font-size="20" font-weight="700" fill="#1DB954" opacity="0.5">&lt;dev&gt;</text>
  <text x="1040" y="70" font-family="'Fira Code', monospace" font-size="20" font-weight="700" fill="#FFFFFF" opacity="0.5">&lt;/engineer&gt;</text>

  <!-- Main Title: Crisp White with Glow -->
  <text x="600" y="125" text-anchor="middle" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="52" letter-spacing="6" fill="#FFFFFF" filter="url(#glow)">
    EPUN MANULA
  </text>

  <!-- Subtitle Line: Signature Green -->
  <text x="600" y="165" text-anchor="middle" font-family="'Fira Code', monospace" font-weight="700" font-size="18" letter-spacing="3" fill="#1DB954">
    SOFTWARE ENGINEER • FULL-STACK DEVELOPER • TECH ENTREPRENEUR
  </text>

  <!-- Skill Pills: Pure Green, Black & White -->
  <g transform="translate(210, 196)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="170" height="34" rx="17" fill="rgba(29, 185, 84, 0.12)" stroke="#1DB954" stroke-opacity="0.5" />
    <text x="85" y="22" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Web Systems</text>

    <!-- Pill 2 -->
    <rect x="190" y="0" width="180" height="34" rx="17" fill="rgba(255, 255, 255, 0.06)" stroke="#FFFFFF" stroke-opacity="0.3" />
    <text x="280" y="22" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#1DB954">Cloud Architecture</text>

    <!-- Pill 3 -->
    <rect x="390" y="0" width="200" height="34" rx="17" fill="rgba(29, 185, 84, 0.12)" stroke="#1DB954" stroke-opacity="0.5" />
    <text x="490" y="22" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Browser Utilities &amp; AI</text>

    <!-- Pill 4 -->
    <rect x="610" y="0" width="170" height="34" rx="17" fill="rgba(255, 255, 255, 0.06)" stroke="#FFFFFF" stroke-opacity="0.3" />
    <text x="695" y="22" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#1DB954">Music Production</text>
  </g>

  <!-- Bottom Bar: Green & White Icons -->
  <rect x="320" y="256" width="560" height="36" rx="18" fill="rgba(0, 0, 0, 0.6)" stroke="rgba(29, 185, 84, 0.4)" />
  
  <circle cx="345" cy="274" r="5" fill="#1DB954" />
  <text x="360" y="279" text-anchor="start" font-family="'Fira Code', monospace" font-size="14" font-weight="700" fill="#FFFFFF">
    epunmanula.com
  </text>

  <text x="590" y="279" text-anchor="middle" font-family="'Fira Code', monospace" font-size="14" font-weight="400" fill="#1DB954">•</text>

  <circle cx="625" cy="274" r="5" fill="#FFFFFF" />
  <text x="640" y="279" text-anchor="start" font-family="'Fira Code', monospace" font-size="14" font-weight="700" fill="#1DB954">
    dev@epunmanula.com
  </text>
</svg>
