<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="100%" height="100%">
  <defs>
    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-strong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Metallic Emerald Gradients -->
    <linearGradient id="metal-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005236" />
      <stop offset="25%" stop-color="#00ffcc" />
      <stop offset="50%" stop-color="#008055" />
      <stop offset="75%" stop-color="#00ff88" />
      <stop offset="100%" stop-color="#004028" />
    </linearGradient>
    
    <linearGradient id="metal-shine" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#003b1d" />
      <stop offset="25%" stop-color="#00ffbb" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="75%" stop-color="#00ffbb" />
      <stop offset="100%" stop-color="#003b1d" />
    </linearGradient>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;700&amp;display=swap');

    /* Premium Zero-Gravity Floating/Swaying and 3D Perspective Rotation */
    @keyframes float-shake-1 {
      0%, 100% { transform: translateY(0px) rotate(0deg) skewX(0deg); }
      25% { transform: translateY(-7px) rotate(-2deg) skewX(1deg); }
      50% { transform: translateY(-13px) rotate(0deg) skewX(0deg); }
      75% { transform: translateY(-7px) rotate(2deg) skewX(-1deg); }
    }
    @keyframes float-shake-2 {
      0%, 100% { transform: translateY(0px) rotate(0deg) skewX(0deg); }
      25% { transform: translateY(7px) rotate(1.5deg) skewX(-1.5deg); }
      50% { transform: translateY(13px) rotate(0deg) skewX(0deg); }
      75% { transform: translateY(7px) rotate(-1.5deg) skewX(1.5deg); }
    }
    @keyframes float-shake-3 {
      0%, 100% { transform: translateY(0px) rotate(-1deg) skewX(1deg); }
      25% { transform: translateY(-6px) rotate(1deg) skewX(-1deg); }
      50% { transform: translateY(-11px) rotate(-1deg) skewX(1deg); }
      75% { transform: translateY(-6px) rotate(2deg) skewX(-1deg); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.65; filter: drop-shadow(0 0 6px rgba(0,255,136,0.5)) drop-shadow(0 0 12px rgba(0,240,255,0.3)); }
      50% { opacity: 1.0; filter: drop-shadow(0 0 22px rgba(0,255,136,0.9)) drop-shadow(0 0 30px rgba(0,240,255,0.7)); }
    }
    @keyframes matrix-code {
      0% { transform: translateY(-100%); opacity: 0; }
      10% { opacity: 0.35; }
      90% { opacity: 0.35; }
      100% { transform: translateY(100%); opacity: 0; }
    }
    @keyframes scanline {
      0% { transform: translateY(-420px); }
      100% { transform: translateY(420px); }
    }
    @keyframes scale-up {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }

    .bg-black {
      fill: #010704;
    }
    
    .logo-main {
      animation: pulse 4.5s ease-in-out infinite, scale-up 9s ease-in-out infinite;
      transform-origin: 500px 210px;
    }

    /* Ambient Green/Cyan glowing aura behind the colored brand icons */
    .glow-aura {
      filter: drop-shadow(0 0 12px rgba(0, 255, 136, 0.75)) drop-shadow(0 0 4px rgba(0, 240, 255, 0.45));
    }
    .glow-white {
      filter: drop-shadow(0 0 12px #ffffff) drop-shadow(0 0 4px #00ff88);
    }

    /* Floating sway animations */
    .f1 { animation: float-shake-1 6s ease-in-out infinite; }
    .f2 { animation: float-shake-2 7s ease-in-out infinite; }
    .f3 { animation: float-shake-3 6.5s ease-in-out infinite; }

    .matrix-group {
      font-family: 'Fira Code', monospace;
      font-size: 9px;
      font-weight: 700;
      fill: #00ff88;
    }

    .matrix-col-1 { animation: matrix-code 16s linear infinite; }
    .matrix-col-2 { animation: matrix-code 20s linear infinite; }
    .matrix-col-3 { animation: matrix-code 14s linear infinite; }
    .matrix-col-4 { animation: matrix-code 18s linear infinite; }

    .scanline {
      width: 1000px;
      height: 4px;
      fill: rgba(0, 255, 136, 0.05);
      animation: scanline 8s linear infinite;
    }
  </style>

  <!-- Solid Cyber Background -->
  <rect width="1000" height="420" class="bg-black" />

  <!-- Grid Perspective Lines -->
  <g stroke="#031e0f" stroke-width="1.5" opacity="0.6">
    <!-- Concentric grid boxes -->
    <rect x="50" y="21" width="900" height="378" fill="none" />
    <rect x="150" y="63" width="700" height="294" fill="none" />
    <rect x="250" y="105" width="500" height="210" fill="none" />
    <rect x="350" y="147" width="300" height="126" fill="none" />
    
    <!-- Radiating Perspective Lines -->
    <line x1="500" y1="210" x2="0" y2="0" />
    <line x1="500" y1="210" x2="1000" y2="0" />
    <line x1="500" y1="210" x2="0" y2="420" />
    <line x1="500" y1="210" x2="1000" y2="420" />
    <line x1="500" y1="210" x2="500" y2="0" />
    <line x1="500" y1="210" x2="500" y2="420" />
    <line x1="500" y1="210" x2="0" y2="210" />
    <line x1="500" y1="210" x2="1000" y2="210" />
  </g>

  <!-- Cyber Matrix Stream Overlay -->
  <g class="matrix-group">
    <g class="matrix-col-1" transform="translate(60, 0)">
      <text x="0" y="40">const developer = "Epun Manula";</text>
      <text x="0" y="70">system.init();</text>
      <text x="0" y="100">loadTechStack();</text>
      <text x="0" y="130">if (status === "active") {</text>
      <text x="15" y="160">console.log("Welcome to my profile!");</text>
      <text x="0" y="190">}</text>
    </g>

    <g class="matrix-col-2" transform="translate(230, 0)" style="animation-delay: -5s;">
      <text x="0" y="50">SELECT * FROM skills;</text>
      <text x="0" y="80">DATABASE CONNECTED</text>
      <text x="0" y="110">PORT: 8080</text>
      <text x="0" y="140">npm run dev</text>
      <text x="0" y="170">App listening...</text>
    </g>

    <g class="matrix-col-3" transform="translate(660, 0)" style="animation-delay: -3s;">
      <text x="0" y="40">import React, { useState } from 'react';</text>
      <text x="0" y="70">const [focus, setFocus] = useState(true);</text>
      <text x="0" y="100">export default function App() {</text>
      <text x="15" y="130">return &lt;EMMETabs /&gt;;</text>
      <text x="0" y="160">}</text>
    </g>

    <g class="matrix-col-4" transform="translate(820, 0)" style="animation-delay: -8s;">
      <text x="0" y="60">class SoftwareEngineer {</text>
      <text x="15" y="90">constructor() {</text>
      <text x="30" y="120">this.passion = "coding";</text>
      <text x="30" y="150">this.location = "Sri Lanka";</text>
      <text x="15" y="180">}</text>
      <text x="0" y="210">}</text>
    </g>
  </g>

