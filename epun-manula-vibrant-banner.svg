<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#070a14" />
      <stop offset="100%" stop-color="#04060b" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="green-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1DB954" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Glassmorphism Filter -->
    <filter id="blur-bg" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" />
    </filter>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)" />
  <rect width="1200" height="320" rx="16" fill="url(#grid)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="150" cy="80" r="160" fill="#1DB954" opacity="0.15" filter="url(#blur-bg)" />
  <circle cx="1050" cy="240" r="180" fill="#3B82F6" opacity="0.12" filter="url(#blur-bg)" />
  <circle cx="600" cy="160" r="140" fill="#8B5CF6" opacity="0.10" filter="url(#blur-bg)" />

  <!-- Border Highlight -->
  <rect x="1" y="1" width="1198" height="318" rx="15" fill="none" stroke="url(#green-glow)" stroke-opacity="0.3" stroke-width="2" />

  <!-- Decorative Tech Elements -->
  <g opacity="0.25" stroke="#1DB954" stroke-width="1" fill="none">
    <polygon points="60,40 85,25 110,40 110,70 85,85 60,70" />
    <polygon points="115,40 140,25 165,40 165,70 140,85 115,70" />
    <polygon points="87,88 112,73 137,88 137,118 112,133 87,118" />
  </g>

  <!-- Code Tag Accents -->
  <text x="60" y="270" font-family="'Fira Code', 'Courier New', monospace" font-size="20" fill="#1DB954" opacity="0.4">&lt;developer&gt;</text>
  <text x="1030" y="70" font-family="'Fira Code', 'Courier New', monospace" font-size="20" fill="#3B82F6" opacity="0.4">&lt;/engineer&gt;</text>

  <!-- Center Content Container -->
  <!-- Main Title -->
  <text x="600" y="125" text-anchor="middle" font-family="'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="48" letter-spacing="4" fill="#FFFFFF" filter="url(#glow)">
    EPUN MANULA
  </text>

  <!-- Subtitle Line -->
  <text x="600" y="165" text-anchor="middle" font-family="'Fira Code', monospace" font-weight="600" font-size="18" letter-spacing="2" fill="#1DB954">
    SOFTWARE ENGINEER • FULL-STACK DEVELOPER • TECH ENTREPRENEUR
  </text>

  <!-- Skill / Domain Pills -->
  <g transform="translate(230, 196)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="160" height="34" rx="17" fill="rgba(29, 185, 84, 0.1)" stroke="#1DB954" stroke-opacity="0.4" />
    <text x="80" y="22" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#A7F3D0">Web Systems</text>

    <!-- Pill 2 -->
    <rect x="180" y="0" width="160" height="34" rx="17" fill="rgba(6, 182, 212, 0.1)" stroke="#06B6D4" stroke-opacity="0.4" />
    <text x="260" y="22" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#BAE6FD">Cloud Architecture</text>

    <!-- Pill 3 -->
    <rect x="360" y="0" width="180" height="34" rx="17" fill="rgba(139, 92, 246, 0.1)" stroke="#8B5CF6" stroke-opacity="0.4" />
    <text x="450" y="22" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#DDD6FE">Browser Utilities &amp; AI</text>

    <!-- Pill 4 -->
    <rect x="560" y="0" width="180" height="34" rx="17" fill="rgba(236, 72, 153, 0.1)" stroke="#EC4899" stroke-opacity="0.4" />
    <text x="650" y="22" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#FBCFE8">Music Composition</text>
  </g>

  <!-- Bottom Bar with Website & Email -->
  <rect x="330" y="256" width="540" height="36" rx="18" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(29, 185, 84, 0.3)" />
  <circle cx="355" cy="274" r="5" fill="#1DB954" />
  <text x="370" y="279" text-anchor="start" font-family="'Fira Code', monospace" font-size="14" font-weight="600" fill="#E2E8F0">
    epunmanula.com
  </text>

  <text x="590" y="279" text-anchor="middle" font-family="'Fira Code', monospace" font-size="14" font-weight="400" fill="#64748B">•</text>

  <circle cx="625" cy="274" r="5" fill="#3B82F6" />
  <text x="640" y="279" text-anchor="start" font-family="'Fira Code', monospace" font-size="14" font-weight="600" fill="#E2E8F0">
    dev@epunmanula.com
  </text>
</svg>
