    <path d="M 420,185 C 420,145 448,135 475,135 V 295" stroke="#ffffff" stroke-width="1.2" fill="none" stroke-linecap="round" />
    <path d="M 580,185 C 580,145 552,135 525,135 V 295" stroke="#ffffff" stroke-width="1.2" fill="none" stroke-linecap="round" />
  </g>

