    <!-- Reflective Chrome Highlighting Overlay (Creates glossy 3D bevels) -->
    <path d="M 370,185 C 370,120 425,95 500,95 C 575,95 630,120 630,185" stroke="url(#metal-shine)" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M 420,185 C 420,145 448,135 475,135 V 295" stroke="url(#metal-shine)" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M 580,185 C 580,145 552,135 525,135 V 295" stroke="url(#metal-shine)" stroke-width="3" fill="none" stroke-linecap="round" />
