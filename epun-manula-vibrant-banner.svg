  <g class="logo-main">
    <!-- Thick Neon Glow Backdrop (Provides base atmospheric glow) -->
    <path d="M 370,185 C 370,120 425,95 500,95 C 575,95 630,120 630,185" stroke="#00ff88" stroke-width="22" fill="none" opacity="0.4" filter="url(#glow-strong)" stroke-linecap="round" />
    <path d="M 420,185 C 420,145 448,135 475,135 V 295" stroke="#00ff88" stroke-width="22" fill="none" opacity="0.4" filter="url(#glow-strong)" stroke-linecap="round" />
