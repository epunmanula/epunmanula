<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="100%" height="100%">
  <defs>
    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-strong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;700&amp;display=swap');

    @keyframes float1 {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(3deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes float2 {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(12px) rotate(-4deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes float3 {
      0% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-8px) scale(1.06); }
      100% { transform: translateY(0px) scale(1); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.6; filter: drop-shadow(0 0 5px rgba(0,255,136,0.4)) drop-shadow(0 0 10px rgba(0,240,255,0.2)); }
      50% { opacity: 1.0; filter: drop-shadow(0 0 18px rgba(0,255,136,0.9)) drop-shadow(0 0 25px rgba(0,240,255,0.6)); }
    }
    @keyframes matrix-code {
      0% { transform: translateY(-100%); opacity: 0; }
      10% { opacity: 0.3; }
      90% { opacity: 0.3; }
      100% { transform: translateY(100%); opacity: 0; }
    }
    @keyframes scanline {
      0% { transform: translateY(-420px); }
      100% { transform: translateY(420px); }
    }
    @keyframes scale-up {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }

    .bg-black {
      fill: #010704;
    }
    
    .logo-main {
      animation: pulse 4.5s ease-in-out infinite, scale-up 9s ease-in-out infinite;
      transform-origin: 500px 210px;
    }

    .f1 { animation: float1 5s ease-in-out infinite; }
    .f2 { animation: float2 6s ease-in-out infinite; }
    .f3 { animation: float3 5.5s ease-in-out infinite; }

    .glow-green {
      filter: drop-shadow(0 0 8px #00ff88);
    }
    .glow-cyan {
      filter: drop-shadow(0 0 8px #00f0ff);
    }
    .glow-white {
      filter: drop-shadow(0 0 10px #ffffff);
    }

    .matrix-group {
      font-family: 'Fira Code', monospace;
      font-size: 9px;
      font-weight: 700;
      fill: #00ff88;
    }

    .matrix-col-1 { animation: matrix-code 16s linear infinite; }
    .matrix-col-2 { animation: matrix-code 20s linear infinite; }
    .matrix-col-3 { animation: matrix-code 14s linear infinite; }
    .matrix-col-4 { animation: matrix-code 18s linear infinite; }

    .scanline {
      width: 1000px;
      height: 4px;
      fill: rgba(0, 255, 136, 0.05);
      animation: scanline 8s linear infinite;
    }
  </style>

  <!-- Solid Cyber Background -->
  <rect width="1000" height="420" class="bg-black" />

  <!-- Grid Perspective Lines -->
  <g stroke="#031e0f" stroke-width="1.5" opacity="0.6">
    <!-- Concentric grid boxes -->
    <rect x="50" y="21" width="900" height="378" fill="none" />
    <rect x="150" y="63" width="700" height="294" fill="none" />
    <rect x="250" y="105" width="500" height="210" fill="none" />
    <rect x="350" y="147" width="300" height="126" fill="none" />
    
    <!-- Radiating Perspective Lines -->
    <line x1="500" y1="210" x2="0" y2="0" />
    <line x1="500" y1="210" x2="1000" y2="0" />
    <line x1="500" y1="210" x2="0" y2="420" />
    <line x1="500" y1="210" x2="1000" y2="420" />
    <line x1="500" y1="210" x2="500" y2="0" />
    <line x1="500" y1="210" x2="500" y2="420" />
    <line x1="500" y1="210" x2="0" y2="210" />
    <line x1="500" y1="210" x2="1000" y2="210" />
  </g>

  <!-- Cyber Matrix Stream Overlay -->
  <g class="matrix-group">
    <g class="matrix-col-1" transform="translate(60, 0)">
      <text x="0" y="40">const developer = "Epun Manula";</text>
      <text x="0" y="70">system.init();</text>
      <text x="0" y="100">loadTechStack();</text>
      <text x="0" y="130">if (status === "active") {</text>
      <text x="15" y="160">console.log("Welcome to my profile!");</text>
      <text x="0" y="190">}</text>
    </g>

    <g class="matrix-col-2" transform="translate(230, 0)" style="animation-delay: -5s;">
      <text x="0" y="50">SELECT * FROM skills;</text>
      <text x="0" y="80">DATABASE CONNECTED</text>
      <text x="0" y="110">PORT: 8080</text>
      <text x="0" y="140">npm run dev</text>
      <text x="0" y="170">App listening...</text>
    </g>

    <g class="matrix-col-3" transform="translate(660, 0)" style="animation-delay: -3s;">
      <text x="0" y="40">import React, { useState } from 'react';</text>
      <text x="0" y="70">const [focus, setFocus] = useState(true);</text>
      <text x="0" y="100">export default function App() {</text>
      <text x="15" y="130">return &lt;EMMETabs /&gt;;</text>
      <text x="0" y="160">}</text>
    </g>

    <g class="matrix-col-4" transform="translate(820, 0)" style="animation-delay: -8s;">
      <text x="0" y="60">class SoftwareEngineer {</text>
      <text x="15" y="90">constructor() {</text>
      <text x="30" y="120">this.passion = "coding";</text>
      <text x="30" y="150">this.location = "Sri Lanka";</text>
      <text x="15" y="180">}</text>
      <text x="0" y="210">}</text>
    </g>
  </g>

  <!-- Glowing Central Double-Line Authentic Monogram Logo (Highly Polished Neon Tubes) -->
  <g class="logo-main">
    <!-- Thick Neon Glow Backdrop -->
    <path d="M 370,185 C 370,120 425,95 500,95 C 575,95 630,120 630,185" stroke="#00ff88" stroke-width="16" fill="none" opacity="0.35" filter="url(#glow-strong)" stroke-linecap="round" />
    <path d="M 420,185 C 420,145 448,135 475,135 V 295" stroke="#00ff88" stroke-width="16" fill="none" opacity="0.35" filter="url(#glow-strong)" stroke-linecap="round" />
    <path d="M 580,185 C 580,145 552,135 525,135 V 295" stroke="#00ff88" stroke-width="16" fill="none" opacity="0.35" filter="url(#glow-strong)" stroke-linecap="round" />
    <polygon points="370,195 415,195 415,320 370,350" fill="#00ff88" opacity="0.35" filter="url(#glow-strong)" />
    <polygon points="585,195 630,195 630,350 585,320" fill="#00ff88" opacity="0.35" filter="url(#glow-strong)" />
    
    <!-- Emerald Green Base Outline -->
    <path d="M 370,185 C 370,120 425,95 500,95 C 575,95 630,120 630,185" stroke="#00ff88" stroke-width="6" fill="none" stroke-linecap="round" />
    <path d="M 420,185 C 420,145 448,135 475,135 V 295" stroke="#00ff88" stroke-width="6" fill="none" stroke-linecap="round" />
    <path d="M 580,185 C 580,145 552,135 525,135 V 295" stroke="#00ff88" stroke-width="6" fill="none" stroke-linecap="round" />
    <polygon points="370,195 415,195 415,320 370,350" fill="none" stroke="#00ff88" stroke-width="4" stroke-linejoin="round" />
    <polygon points="585,195 630,195 630,350 585,320" fill="none" stroke="#00ff88" stroke-width="4" stroke-linejoin="round" />

    <!-- Highly Reflective Shiny White Inner Core -->
    <path d="M 370,185 C 370,120 425,95 500,95 C 575,95 630,120 630,185" stroke="#ffffff" stroke-width="2" fill="none" class="glow-white" stroke-linecap="round" />
    <path d="M 420,185 C 420,145 448,135 475,135 V 295" stroke="#ffffff" stroke-width="2" fill="none" class="glow-white" stroke-linecap="round" />
    <path d="M 580,185 C 580,145 552,135 525,135 V 295" stroke="#ffffff" stroke-width="2" fill="none" class="glow-white" stroke-linecap="round" />
    <polygon points="370,195 415,195 415,320 370,350" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round" class="glow-white" />
    <polygon points="585,195 630,195 630,350 585,320" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round" class="glow-white" />
  </g>

  <!-- Horizontal Scanline Effect -->
  <rect class="scanline" x="0" y="0" />

  <!-- Surrounding Animated Icons (Inlined directly to guarantee rendering in GitHub markdown <img> tags) -->
  
  <!-- Left Side Icons -->
  
  <!-- 1. PHP at (100, 220) -->
  <g class="f1 glow-green" transform="translate(100, 220)">
    <ellipse rx="22" ry="12" fill="none" stroke="#00ff88" stroke-width="2" />
    <text x="0" y="4" font-family="'Fira Code', monospace" font-weight="900" font-size="11" fill="#00ff88" text-anchor="middle">php</text>
  </g>
  
  <!-- 2. HTML5 at (120, 320) -->
  <g class="f2 glow-green" transform="translate(120, 320)">
    <path d="M-15,-18 L15,-18 L12,14 L0,20 L-12,14 Z" fill="none" stroke="#00ff88" stroke-width="2" />
    <text x="0" y="-3" font-family="'Fira Code', monospace" font-weight="900" font-size="10" fill="#00ff88" text-anchor="middle">HTML</text>
    <text x="0" y="9" font-family="'Fira Code', monospace" font-weight="900" font-size="12" fill="#00ff88" text-anchor="middle">5</text>
  </g>
  
  <!-- 3. CSS3 at (190, 180) -->
  <g class="f3 glow-cyan" transform="translate(190, 180)">
    <path d="M-15,-18 L15,-18 L12,14 L0,20 L-12,14 Z" fill="none" stroke="#00f0ff" stroke-width="2" />
    <text x="0" y="-3" font-family="'Fira Code', monospace" font-weight="900" font-size="10" fill="#00f0ff" text-anchor="middle">CSS</text>
    <text x="0" y="9" font-family="'Fira Code', monospace" font-weight="900" font-size="12" fill="#00f0ff" text-anchor="middle">3</text>
  </g>

  <!-- 4. JavaScript at (250, 90) -->
  <g class="f1 glow-green" transform="translate(250, 90)">
    <rect x="-16" y="-16" width="32" height="32" rx="4" fill="none" stroke="#00ff88" stroke-width="2" />
    <text x="6" y="10" font-family="'Fira Code', monospace" font-weight="900" font-size="15" fill="#00ff88" text-anchor="middle">JS</text>
  </g>

  <!-- 5. React at (320, 160) -->
  <g class="f2 glow-cyan" transform="translate(320, 160)">
    <ellipse rx="22" ry="8" fill="none" stroke="#00f0ff" stroke-width="2" transform="rotate(0)" />
    <ellipse rx="22" ry="8" fill="none" stroke="#00f0ff" stroke-width="2" transform="rotate(60)" />
    <ellipse rx="22" ry="8" fill="none" stroke="#00f0ff" stroke-width="2" transform="rotate(120)" />
    <circle r="4" fill="#00f0ff" />
  </g>

  <!-- 6. Next.js at (180, 120) -->
  <g class="f3 glow-white" transform="translate(180, 120)">
    <circle r="15" fill="none" stroke="#ffffff" stroke-width="2" />
    <path d="M-6,7 L5,-6 M-6,-6 V6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <path d="M5,-6 V4" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- 7. Tailwind CSS at (280, 270) -->
  <g class="f1 glow-cyan" transform="translate(280, 270)">
    <path d="M-15,0 C-10,-8 -3,-8 2,-2 C7,4 12,4 17,-2 C12,4 5,4 0,-2 C-5,-8 -10,-8 -15,0 Z M-17,6 C-12,-2 -5,-2 0,4 C5,10 10,10 15,4 C10,10 3,10 -2,4 C-7,-2 -12,-2 -17,6 Z" fill="none" stroke="#00f0ff" stroke-width="2" />
  </g>

  <!-- 8. Laravel at (310, 370) -->
  <g class="f2 glow-green" transform="translate(310, 370)">
    <path d="M-12,-15 L0,-20 L12,-15 L12,5 L0,10 L-12,5 Z M0,-20 V10 M-12,-5 L0,0 L12,-5" fill="none" stroke="#00ff88" stroke-width="2" />
    <text x="0" y="4" font-family="'Fira Code', monospace" font-size="10" font-weight="900" fill="#00ff88" text-anchor="middle">L</text>
  </g>

  <!-- 9. Node.js at (320, 90) -->
  <g class="f3 glow-green" transform="translate(320, 90)">
    <path d="M0,-18 L15,-9 L15,9 L0,18 L-15,9 L-15,-9 Z" fill="none" stroke="#00ff88" stroke-width="2" />
    <text x="0" y="4" font-family="'Fira Code', monospace" font-weight="900" font-size="10" fill="#00ff88" text-anchor="middle">node</text>
  </g>

  <!-- 10. Express.js at (120, 90) -->
  <g class="f1 glow-cyan" transform="translate(120, 90)">
    <circle r="15" fill="none" stroke="#00f0ff" stroke-width="2" />
    <text x="0" y="4" font-family="'Fira Code', monospace" font-size="10" font-weight="900" fill="#00f0ff" text-anchor="middle">ex</text>
  </g>

  <!-- 11. Python at (220, 330) -->
  <g class="f2 glow-cyan" transform="translate(220, 330)">
    <path d="M-5,-12 H2 C5,-12 6,-10 6,-7 V-4 H2 V-2 H-5 C-8,-2 -10,-4 -10,-7 V-9 C-10,-12 -8,-12 -5,-12 Z" fill="none" stroke="#00f0ff" stroke-width="2" />
    <path d="M5,12 H-2 C-5,12 -6,10 -6,7 V-1 H-2 V-3 H5 C8,-3 10,-5 10,-8 V-6 C10,-3 8,12 5,12 Z" fill="none" stroke="#00f0ff" stroke-width="2" />
    <circle cx="-2" cy="-8" r="1" fill="#00f0ff" />
    <circle cx="2" cy="8" r="1" fill="#00f0ff" />
  </g>

  <!-- Right Side Icons -->

  <!-- 12. MySQL at (680, 170) -->
  <g class="f1 glow-cyan" transform="translate(680, 170)">
    <text x="0" y="6" font-family="'Fira Code', monospace" font-weight="900" font-size="9" fill="#00f0ff" text-anchor="middle">SQL</text>
    <path d="M-13,8 C-9,6 -5,1 -7,-7 C-7,-7 -3,-3 1,-3 C3.5,-3 6,-5.5 8,-9 C8,-9 7.5,-4.5 5,-1.5 C3.5,1 0.5,3.5 -3,4 L-6,9.5 Z" fill="none" stroke="#00f0ff" stroke-width="1.5" />
  </g>

  <!-- 13. AWS at (880, 340) -->
  <g class="f2 glow-green" transform="translate(880, 340)">
    <text x="0" y="-2" font-family="'Fira Code', monospace" font-weight="900" font-size="12" fill="#00ff88" text-anchor="middle">aws</text>
    <path d="M-13,5 Q0,12 13,5" fill="none" stroke="#00ff88" stroke-width="1.5" stroke-linecap="round" />
    <path d="M9,6 L13,5 L12,9" fill="none" stroke="#00ff88" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- 14. cPanel at (780, 90) -->
  <g class="f3 glow-green" transform="translate(780, 90)">
    <circle r="14" fill="none" stroke="#00ff88" stroke-width="2" />
    <text x="0" y="4" font-family="'Fira Code', monospace" font-weight="900" font-size="11" fill="#00ff88" text-anchor="middle">cP</text>
  </g>

  <!-- 15. Github at (740, 330) -->
  <g class="f1 glow-green" transform="translate(740, 330)">
    <path d="M0,-18 C-10,-18 -18,-10 -18,0 C-18,8 -13,15 -6,17 C-5,17 -5,17 -5,16 C-5,15 -5,13 -5,11 C-10,12 -11,9 -11,9 C-12,7 -13,7 -13,7 C-14,6 -13,6 -13,6 C-11,6 -10,8 -10,8 C-9,10 -7,9 -6,9 C-6,7 -5,6 -5,6 C-9,5 -13,4 -13,-3 C-13,-5 -12,-7 -11,-8 C-11,-8 -12,-10 -11,-12 C-11,-12 -9,-11 -5,-8 C-3,-9 0,-9 3,-8 C7,-11 9,-12 9,-12 C10,-10 9,-8 9,-8 C10,-7 11,-5 11,-3 C11,4 7,5 3,6 C4,7 4,9 4,11 C4,13 4,15 4,16 C4,17 4,17 5,17 C12,15 17,8 17,0 C17,-10 9,-18 0,-18 Z" fill="none" stroke="#00ff88" stroke-width="2" />
  </g>

  <!-- 16. Ubuntu at (620, 340) -->
  <g class="f2 glow-cyan" transform="translate(620, 340)">
    <circle r="15" fill="none" stroke="#00f0ff" stroke-width="2" />
    <circle cx="-10" cy="0" r="2" fill="#00f0ff" />
    <circle cx="5" cy="8.6" r="2" fill="#00f0ff" />
    <circle cx="5" cy="-8.6" r="2" fill="#00f0ff" />
    <path d="M-5,-5 A7,7 0 0,1 5,-5 M5,5 A7,7 0 0,1 -5,5 M-7,0 A7,7 0 0,1 -7,-1" fill="none" stroke="#00f0ff" stroke-width="1.5" />
  </g>

  <!-- 17. Git at (900, 100) -->
  <g class="f3 glow-green" transform="translate(900, 100)">
    <rect x="-10" y="-10" width="20" height="20" transform="rotate(45)" fill="none" stroke="#00ff88" stroke-width="2" />
    <circle cx="0" cy="-6" r="2.5" fill="#00ff88" />
    <circle cx="6" cy="0" r="2.5" fill="#00ff88" />
    <circle cx="-6" cy="6" r="2.5" fill="#00ff88" />
    <path d="M-6,6 L6,0 M0,-6 V6" fill="none" stroke="#00ff88" stroke-width="2" />
  </g>

  <!-- 18. Figma at (680, 280) -->
  <g class="f1 glow-cyan" transform="translate(680, 280)">
    <path d="M-8,-12 C-8,-12 -8,-6 -2,-6 C-2,-6 -2,-12 -8,-12 Z M-2,-12 C-2,-12 4,-12 4,-6 C4,-6 -2,-6 -2,-12 Z M-8,-6 C-8,-6 -8,0 -2,0 C-2,0 -2,-6 -8,-6 Z M-2,-6 C-2,-6 4,-6 4,0 C4,0 -2,0 -2,-6 Z M-8,0 C-8,0 -8,6 -8,12 C-8,12 -2,12 -2,6 C-2,0 -8,0 -8,0 Z" fill="none" stroke="#00f0ff" stroke-width="2" />
  </g>

  <!-- 19. Canva at (780, 200) -->
  <g class="f2 glow-cyan" transform="translate(780, 200)">
    <circle r="15" fill="none" stroke="#00f0ff" stroke-width="2" />
    <text x="0" y="4" font-family="'Fira Code', monospace" font-weight="900" font-size="12" fill="#00f0ff" text-anchor="middle">C</text>
  </g>

  <!-- 20. FL Studio at (920, 230) -->
  <g class="f3 glow-green" transform="translate(920, 230)">
    <path d="M0,-14 C4,-14 10,-9.5 10,-2 C10,5 4,12 0,12 C-4,12 -10,5 -10,-2 C-10,-9.5 -4,-14 0,-14 Z M0,-14 C-1.5,-16.5 -5,-16.5 -5,-16.5 C-5,-16.5 -2.5,-13 0,-11 Z" fill="none" stroke="#00ff88" stroke-width="2" />
  </g>

  <!-- 21. Capcut at (820, 150) -->
  <g class="f1 glow-white" transform="translate(820, 150)">
    <polygon points="-12,-12 12,-12 12,12 -12,12" fill="none" stroke="#ffffff" stroke-width="2" />
    <polygon points="-4,-6 6,0 -4,6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" />
    <circle cx="-8" cy="-8" r="1.5" fill="#ffffff" />
    <circle cx="8" cy="-8" r="1.5" fill="#ffffff" />
    <circle cx="-8" cy="8" r="1.5" fill="#ffffff" />
    <circle cx="8" cy="8" r="1.5" fill="#ffffff" />
  </g>

  <!-- 22. VS Code at (600, 90) -->
  <g class="f2 glow-cyan" transform="translate(600, 90)">
    <path d="M-15,-10 L-8,-16 L15,-8 L5,0 L15,8 L-8,16 L-15,10 Z" fill="none" stroke="#00f0ff" stroke-width="2" />
    <path d="M-15,-10 L5,0 L-15,10 M-8,-16 L-8,16" fill="none" stroke="#00f0ff" stroke-width="1.5" />
